<svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- World of Music favicon.
     A photographic globe (public/icons/nav-world.png) turns to mush at 16px,
     so this is a purpose-drawn glyph: a SOLID accent disc with the graticule
     knocked out in white. Filled-with-negative-space reads far better at tab
     size than thin strokes on transparency — the silhouette alone says
     "globe" even when the interior lines blur together.
     Only an equator + one meridian + two short parallels: any more detail
     collapses into noise at 16px. -->
<circle cx="16" cy="16" r="15" fill="#737CF4"/>
<g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round">
  <!-- equator -->
  <path d="M1.6 16h28.8"/>
  <!-- meridian: the ellipse that gives the disc its curvature -->
  <ellipse cx="16" cy="16" rx="6.6" ry="14.6"/>
  <!-- two parallels, trimmed so they don't crowd the rim -->
  <path d="M4.6 9.2h22.8"/>
  <path d="M4.6 22.8h22.8"/>
</g>
</svg>
