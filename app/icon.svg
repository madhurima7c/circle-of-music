<svg width="96" height="96" viewBox="-70 -70 1078 1078" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Circle of Music mark — the 8-square version supplied by the user.
     Fewer, larger squares than the 16-square nav ring, which is exactly what
     a favicon needs: at 16px the old ring's squares fused into a dotted blur.
     No background plate: the mark stands on its own, so it sits cleanly on a
     light or dark tab strip. viewBox is padded 70 units all round so the
     squares don't touch a rounded tab crop. -->
<rect x="379" width="180" height="180" fill="#737CF4"/>
<rect x="726.994" y="77.8695" width="180" height="180" transform="rotate(45 726.994 77.8695)" fill="#737CF4"/>
<rect x="379" y="758" width="180" height="180" fill="#737CF4"/>
<rect x="191.006" y="613.856" width="180" height="180" transform="rotate(45 191.006 613.856)" fill="#737CF4"/>
<rect x="758" y="379" width="180" height="180" fill="#737CF4"/>
<rect x="726.994" y="613.856" width="180" height="180" transform="rotate(45 726.994 613.856)" fill="#737CF4"/>
<rect y="379" width="180" height="180" fill="#737CF4"/>
<rect x="191.006" y="77.8694" width="180" height="180" transform="rotate(45 191.006 77.8694)" fill="#737CF4"/>
</svg>
